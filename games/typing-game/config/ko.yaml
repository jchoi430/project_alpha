# 단순 YAML: "key: value" 와 "- 항목" 목록만 사용합니다.
intro: 하늘에서 단어가 떨어져요. 바닥에 닿기 전에 입력해서 터뜨려 보세요!
how_to:
  - 떨어지는 단어를 입력하면 터져요. 글자가 모두 맞으면 자동으로 터집니다.
  - 한글은 마지막 글자를 쓴 뒤 스페이스나 입력 버튼(엔터)을 누르면 확인돼요.
  - 휴대폰에서는 아래 입력창을 눌러 키보드를 열어요.
  - 연속으로 맞히면 콤보가 쌓여 점수가 더 올라가요. 시간은 60초예요.
parent_guide:
  - 6~10세 어린이가 기초 단어 타자를 연습하는 게임입니다.
  - 1단계는 받침 없는 짧은 단어, 2단계는 받침 있는 긴 단어, 3단계는 짧은 문장입니다.
  - 아무 정보도 밖으로 전송하지 않으며, 최고 점수만 이 기기에 저장됩니다.
  - 실제 타자 연습에는 물리 키보드가 좋아요.
