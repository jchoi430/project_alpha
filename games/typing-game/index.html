<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>Typing Rain</title>
<style>
  :root {
    --bg: #12304f; --bg2: #1d4f7a; --panel: #ffffff; --text: #10253a;
    --accent: #ffcf3f; --accent-text: #3a2a00; --good: #1f9d55; --bad: #d64545;
    --word-bg: #ffffff; --word-text: #10253a; --typed: #1f9d55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); touch-action: manipulation; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--text); position: fixed; inset: 0; width: 100%; }
  #app { position: fixed; left: 0; top: 0; width: 100%; height: 100dvh; background: linear-gradient(var(--bg2), var(--bg)); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }
  button { font: inherit; cursor: pointer; min-height: 48px; min-width: 48px; border-radius: 14px; border: 3px solid transparent; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }

  /* start / result */
  .scroll { overflow-y: auto; flex: 1; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card { background: var(--panel); border-radius: 20px; padding: 16px 18px; width: 100%; max-width: 560px; }
  h1 { margin: 0; font-size: clamp(32px, 8vw, 48px); color: #fff; text-align: center; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  p { font-size: 18px; line-height: 1.5; margin: 0 0 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .choice { flex: 1 1 120px; background: #e8eef5; color: var(--text); font-size: 20px; font-weight: 700; padding: 8px 10px; }
  .choice[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: #8a6500; }
  .choice small { display: block; font-size: 15px; font-weight: 600; opacity: .85; }
  .big { background: var(--good); color: #fff; font-size: 26px; font-weight: 800; min-height: 60px; width: 100%; max-width: 560px; }
  .secondary { background: #e8eef5; color: var(--text); font-size: 20px; font-weight: 700; flex: 1 1 140px; }
  details { font-size: 18px; } summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
  ul { margin: 4px 0 8px; padding-left: 22px; } li { font-size: 18px; line-height: 1.5; margin-bottom: 4px; }

  /* play */
  .hud { display: flex; justify-content: space-around; padding: 8px 6px; background: rgba(0,0,0,.35); color: #fff; font-size: clamp(18px, 4.5vw, 24px); font-weight: 700; }
  .hud span b { color: var(--accent); }
  #field { position: relative; flex: 1; overflow: hidden; min-height: 0; }
  #field::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--bad); opacity: .8; }
  .word { position: absolute; top: 0; left: 0; background: var(--word-bg); color: var(--word-text); font-weight: 800; font-size: clamp(22px, 6vw, 34px); padding: 6px 14px; border-radius: 14px; max-width: 94%; text-align: center; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,.3); will-change: transform; }
  .word.long { white-space: normal; font-size: clamp(18px, 4.6vw, 28px); width: max-content; }
  .word .typed { color: var(--typed); }
  .word.pop { animation: pop .35s forwards; }
  .word.miss { animation: miss .4s forwards; }
  @keyframes pop { to { opacity: 0; filter: brightness(1.5); scale: 1.6; } }
  @keyframes miss { to { opacity: 0; scale: .6; } }
  .bar { display: flex; gap: 8px; padding: 8px; background: rgba(0,0,0,.35); }
  #typebox { flex: 1; min-width: 0; min-height: 52px; font-size: 22px; padding: 6px 14px; border-radius: 14px; border: 3px solid var(--accent); background: #fff; color: var(--text); }
  #submit { background: var(--accent); color: var(--accent-text); font-weight: 800; font-size: 18px; padding: 0 16px; }

  .stat { font-size: 22px; display: flex; justify-content: space-between; border-bottom: 1px solid #dde5ee; padding: 8px 0; }
  .newbest { color: var(--good); font-weight: 800; font-size: 24px; text-align: center; margin: 6px 0 0; }
  #loaderr { color: #fff; font-size: 20px; padding: 20px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .word.pop, .word.miss { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="app">
  <div id="loaderr" hidden></div>

  <section id="start" class="screen" hidden>
    <div class="scroll">
      <h1 id="t-title"></h1>
      <div class="card"><p id="intro"></p></div>
      <div class="card"><h2 id="t-lang"></h2><div class="row" id="langs"></div></div>
      <div class="card"><h2 id="t-level"></h2><div class="row" id="levels"></div></div>
      <button class="big" id="startBtn"></button>
      <div class="card"><details><summary id="t-howto"></summary><ul id="howto"></ul></details>
        <details><summary id="t-parent"></summary><ul id="parent"></ul></details></div>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="hud" aria-live="off">
      <span><span id="h-time"></span> <b id="time">60</b></span>
      <span><span id="h-score"></span> <b id="score">0</b></span>
      <span><span id="h-combo"></span> <b id="combo">0</b></span>
    </div>
    <div id="field"></div>
    <form class="bar" id="form" autocomplete="off">
      <input id="typebox" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button type="submit" id="submit"></button>
    </form>
  </section>

  <section id="result" class="screen" hidden>
    <div class="scroll">
      <h1 id="r-title"></h1>
      <div class="card">
        <div class="stat"><span id="r-score-l"></span><b id="r-score"></b></div>
        <div class="stat"><span id="r-hit-l"></span><b id="r-hit"></b></div>
        <div class="stat"><span id="r-miss-l"></span><b id="r-miss"></b></div>
        <div class="stat"><span id="r-best-l"></span><b id="r-best"></b></div>
        <p class="newbest" id="r-new" hidden></p>
      </div>
      <div class="row" style="width:100%;max-width:560px">
        <button class="big" id="again" style="flex:1 1 100%"></button>
        <button class="secondary" id="homeBtn"></button>
      </div>
    </div>
  </section>
</div>

<script src="scripts/game.js"></script>
</body>
</html>
